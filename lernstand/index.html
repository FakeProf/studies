<!doctype html>
<html lang="de">
<meta charset="utf-8">
<!-- Ohne diese Zeile rendert ein Handy die Seite in ~980px Breite und
     skaliert sie herunter — alles wird winzig. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EFF2F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1514" media="(prefers-color-scheme: dark)">
<title>Study Lane</title>
<!-- Als App auf dem Startbildschirm: kein Browserbalken, eigenes Symbol. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="symbole/apple-touch-icon.png">
<link rel="icon" href="symbole/symbol-192.png" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Study Lane">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EFF2F1; --surface:#FBFCFC; --surface-2:#E4E9E8; --surface-3:#DAE1DF;
  --ink:#15201E; --ink-2:#31403D; --muted:#5C6B68; --line:#D1D9D7; --line-strong:#B6C2BF;
  --accent:#13564E; --accent-ink:#FFFFFF; --accent-soft:#D6E7E3; --accent-line:#8FBDB5;
  --ok:#236B43; --ok-soft:#DCEEE3; --ok-line:#8CC3A5;
  --bad:#A23117; --bad-soft:#F7E2DB; --bad-line:#DFA48F;
  --warn:#8A6012; --warn-soft:#F6EAD2;
  --m-OGPM:#13564E; --m-GENE:#855611; --m-SYMG:#553A89; --m-VHRE:#96303E; --m-WSA1:#1C4B82; --m-EPC1:#4F6A1A;
  --shadow:0 1px 2px rgba(20,32,30,.06), 0 6px 20px -12px rgba(20,32,30,.28);
  --r:10px;
  --f-display:"Familjen Grotesk","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1514; --surface:#18201E; --surface-2:#212B29; --surface-3:#2A3634;
    --ink:#E7EDEA; --ink-2:#C4CFCC; --muted:#8FA09C; --line:#2A3634; --line-strong:#3B4947;
    --accent:#57C8B5; --accent-ink:#08201D; --accent-soft:#183230; --accent-line:#2E5A55;
    --ok:#5BC286; --ok-soft:#142E1E; --ok-line:#2E5D3F;
    --bad:#F08A6E; --bad-soft:#331B14; --bad-line:#6A3626;
    --warn:#DCA94E; --warn-soft:#2E2413;
    --m-OGPM:#57C8B5; --m-GENE:#D8A64C; --m-SYMG:#A992E2; --m-VHRE:#E98292; --m-WSA1:#76B0E9; --m-EPC1:#A9C76A;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1514; --surface:#18201E; --surface-2:#212B29; --surface-3:#2A3634;
  --ink:#E7EDEA; --ink-2:#C4CFCC; --muted:#8FA09C; --line:#2A3634; --line-strong:#3B4947;
  --accent:#57C8B5; --accent-ink:#08201D; --accent-soft:#183230; --accent-line:#2E5A55;
  --ok:#5BC286; --ok-soft:#142E1E; --ok-line:#2E5D3F;
  --bad:#F08A6E; --bad-soft:#331B14; --bad-line:#6A3626;
  --warn:#DCA94E; --warn-soft:#2E2413;
  --m-OGPM:#57C8B5; --m-GENE:#D8A64C; --m-SYMG:#A992E2; --m-VHRE:#E98292; --m-WSA1:#76B0E9; --m-EPC1:#A9C76A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--f-body); font-size:16px; line-height:1.55;
  margin:0; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--f-display); font-weight:600; line-height:1.2; text-wrap:balance; margin:0}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer; background:none; border:none}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

.wrap{max-width:1080px; margin:0 auto; padding-inline:16px; padding-block:0 56px}

/* ---- Kopfzeile ---- */
.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1080px; margin:0 auto; padding-inline:16px; padding-block:12px;
  display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.brand{font-family:var(--f-display); font-weight:700; font-size:18px; letter-spacing:-.01em}
.brand span{color:var(--accent)}
.top-meta{font-family:var(--f-mono); font-size:11px; color:var(--muted);
  letter-spacing:.06em; text-transform:uppercase; margin-left:auto; font-variant-numeric:tabular-nums}
.sync{display:inline-flex; align-items:center; gap:5px}
.dot{width:6px; height:6px; border-radius:50%; background:var(--line-strong); flex:none}
.dot.on{background:var(--ok)}

/* ---- Typo-Bausteine ---- */
.eyebrow{font-family:var(--f-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted); font-weight:500}
.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.sans{font-family:var(--f-display)}
.muted{color:var(--muted)}

/* ---- Karten ---- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r)}

/* ---- Dashboard Kopf ---- */
.hero{display:flex; gap:28px; align-items:flex-end; flex-wrap:wrap; padding-block:28px 22px}
.hero h1{font-size:clamp(26px,5vw,36px); letter-spacing:-.02em}
.hero .lede{font-size:15px; color:var(--muted); max-width:46ch; margin-top:6px}
.herostart{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:16px}
.herostart .pool{max-width:38ch}
.kpis{display:flex; gap:26px; flex-wrap:wrap; margin-left:auto}
.kpi{min-width:72px}
.kpi b{display:block; font-family:var(--f-display); font-size:30px; font-weight:600;
  letter-spacing:-.02em; font-variant-numeric:tabular-nums; line-height:1.05}
.kpi .eyebrow{margin-top:2px; display:block}

/* ---- Modulraster ---- */
.grid-mod{display:grid; grid-template-columns:repeat(auto-fit,minmax(178px,1fr)); gap:10px; margin-top:4px}
.modcard{padding:13px 14px 12px; text-align:left; display:block; width:100%;
  border-radius:var(--r); border:1px solid var(--line); background:var(--surface);
  transition:border-color .12s, transform .12s}
.modcard:hover{border-color:var(--line-strong); transform:translateY(-1px)}
.modcard.sel{border-color:var(--mc); box-shadow:inset 0 0 0 1px var(--mc)}
.modcard .code{font-family:var(--f-mono); font-weight:600; font-size:14px; letter-spacing:.06em; color:var(--mc)}
/* display:block, sonst greift weder Umbruch noch Begrenzung: ein <span> ist inline
   und lief bei langen Modulnamen über den Kartenrand. Zwei Zeilen Platz, damit
   die Balken aller Karten auf einer Höhe bleiben. */
.modcard .sub{display:block; font-family:var(--f-display); font-size:12px; color:var(--muted); margin-top:1px;
  line-height:1.35; min-height:calc(2em * 1.35); hyphens:auto; -webkit-hyphens:auto; overflow-wrap:break-word}
.meter{height:5px; border-radius:3px; background:var(--surface-3); margin-top:10px; overflow:hidden; display:flex}
.meter i{display:block; height:100%}
.meter i.a{background:var(--mc)}
.meter i.b{background:var(--bad); opacity:.55}
.modcard .nums{display:flex; justify-content:space-between; margin-top:7px;
  font-family:var(--f-mono); font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums}

/* ---- Abschnitte ---- */
section{margin-top:30px}
.sec-head{display:flex; align-items:baseline; gap:10px; margin-bottom:10px; flex-wrap:wrap}
.sec-head h2{font-size:15px; letter-spacing:.005em}
.sec-head .hint{font-size:12px; color:var(--muted); font-family:var(--f-display)}

/* ---- Filterleiste ---- */
.panel{padding:16px}
.frow{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px}
.frow:last-of-type{margin-bottom:0}
.flabel{font-family:var(--f-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--muted); width:82px; flex:none}
@media (max-width:560px){ .flabel{width:100%} }
.chip{
  font-family:var(--f-display); font-size:12.5px; font-weight:500;
  padding:5px 11px; border-radius:100px; border:1px solid var(--line-strong);
  color:var(--ink-2); background:var(--surface); transition:background .12s,border-color .12s,color .12s;
}
.chip:hover{border-color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.chip.mod[aria-pressed="true"]{background:var(--mc); border-color:var(--mc); color:var(--surface)}
:root[data-theme="dark"] .chip.mod[aria-pressed="true"],
:root:not([data-theme="light"]) .chip.mod[aria-pressed="true"]{color:#0F1514}
.chip .n{font-family:var(--f-mono); font-size:11px; opacity:.72; margin-left:5px; font-variant-numeric:tabular-nums}
/* Wert, der zur übrigen Auswahl keine einzige Frage beiträgt: bleibt klickbar, tritt aber zurück */
.chip.leer:not([aria-pressed="true"]){opacity:.45}

.sel{
  font-family:var(--f-display); font-size:12.5px; font-weight:500; color:var(--ink-2);
  padding:5px 10px; border-radius:100px; border:1px solid var(--line-strong);
  background:var(--surface); max-width:min(100%, 420px); cursor:pointer
}
.sel:hover{border-color:var(--ink-2)}
.sel.aktiv{border-color:var(--accent); background:var(--accent-soft); color:var(--ink)}

.startbar{display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:16px;
  padding-top:14px; border-top:1px solid var(--line)}
.btn{
  font-family:var(--f-display); font-weight:600; font-size:14px;
  padding:10px 18px; border-radius:8px; border:1px solid var(--accent);
  background:var(--accent); color:var(--accent-ink); transition:filter .12s
}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45; cursor:not-allowed; filter:none}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--line-strong)}
.btn.ghost:hover{border-color:var(--ink-2); filter:none}
.btn.sm{padding:7px 13px; font-size:13px}
.pool{font-family:var(--f-mono); font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}

/* ---- Lernziel-Liste ---- */
.goals{display:flex; flex-direction:column; gap:1px; background:var(--line); border:1px solid var(--line);
  border-radius:var(--r); overflow:hidden}
.goal{display:flex; align-items:center; gap:12px; padding:11px 14px; background:var(--surface);
  text-align:left; width:100%; transition:background .12s}
.goal:hover{background:var(--surface-2)}
.goal .tag{font-family:var(--f-mono); font-size:10.5px; font-weight:600; letter-spacing:.06em;
  color:var(--mc); width:42px; flex:none}
.goal .txt{flex:1; font-size:14px; line-height:1.35; font-family:var(--f-display); min-width:0}
.goal .bar{width:84px; height:5px; border-radius:3px; background:var(--surface-3); flex:none; overflow:hidden}
.goal .bar i{display:block; height:100%; background:var(--gc,var(--accent))}
.goal .pct{font-family:var(--f-mono); font-size:12px; width:46px; text-align:right; flex:none;
  font-variant-numeric:tabular-nums; color:var(--gc,var(--muted)); font-weight:500}
@media (max-width:560px){
  .goal{flex-wrap:wrap}
  .goal .txt{flex-basis:100%; order:3}
  .goal .bar{margin-left:auto}
}

/* ---- Verlauf ---- */
.runs{display:flex; flex-direction:column; gap:1px; background:var(--line);
  border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.run{display:flex; align-items:baseline; gap:12px; padding:10px 14px; background:var(--surface);
  font-family:var(--f-mono); font-size:12px; font-variant-numeric:tabular-nums; flex-wrap:wrap}
.run .when{color:var(--muted); width:104px; flex:none}
.run .scope{font-family:var(--f-display); font-size:13px; color:var(--ink-2); flex:1; min-width:120px}
.run .score{font-weight:600}

.empty{padding:26px 16px; text-align:center; color:var(--muted); font-size:14px;
  border:1px dashed var(--line-strong); border-radius:var(--r)}

.backup{border:1px solid var(--line); border-radius:var(--r); background:var(--surface); padding:12px 16px}
.backup summary{font-family:var(--f-display); font-size:14px; font-weight:500; cursor:pointer; color:var(--ink-2)}
.backup summary:hover{color:var(--ink)}
.konto-an{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.konto-an > div:first-child{flex:1; min-width:150px}
.konto-an b{display:block; font-size:16px; margin-top:2px}
.konto-form{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:4px}
.konto-form input{flex:1 1 180px; min-width:0; padding:9px 12px; border-radius:8px;
  border:1px solid var(--line-strong); background:var(--surface-2); color:var(--ink);
  font-family:var(--f-display); font-size:14px}
.konto-form input:focus{border-color:var(--accent); outline:none}

.backup textarea,
.backup input{width:100%; margin-top:8px; padding:9px 12px; border-radius:8px;
  border:1px solid var(--line-strong); background:var(--surface-2); color:var(--ink);
  font-family:var(--f-mono); font-size:11.5px; line-height:1.5}
.backup textarea{resize:vertical}
.backup input:focus{border-color:var(--accent); outline:none}

/* ---- Quiz ---- */
.qwrap{max-width:720px; margin:0 auto; padding-block:22px 40px}
.qprog{display:flex; align-items:center; gap:12px; margin-bottom:18px; flex-wrap:wrap}
.qprog .rail{flex:1; min-width:120px; height:3px; background:var(--surface-3); border-radius:2px; overflow:hidden}
.qprog .rail i{display:block; height:100%; background:var(--accent); transition:width .25s}
.qcard{padding:22px 22px 20px; box-shadow:var(--shadow)}
@media (max-width:560px){ .qcard{padding:18px 15px 16px} }
.qmeta{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:14px}
.badge{font-family:var(--f-mono); font-size:10.5px; font-weight:600; letter-spacing:.07em;
  text-transform:uppercase; padding:3px 7px; border-radius:4px;
  background:var(--surface-2); color:var(--muted)}
.badge.mod{background:transparent; color:var(--mc); border:1px solid currentColor}
.qziel{font-family:var(--f-display); font-size:12.5px; color:var(--muted); margin-bottom:14px;
  padding-left:10px; border-left:2px solid var(--accent-line)}
.qtext{font-size:19px; line-height:1.45; margin-bottom:18px; text-wrap:pretty}
@media (max-width:560px){ .qtext{font-size:17.5px} }

.opts{display:flex; flex-direction:column; gap:8px}
.opt{
  display:flex; gap:11px; align-items:flex-start; text-align:left; width:100%;
  padding:11px 13px; border:1px solid var(--line-strong); border-radius:8px;
  background:var(--surface); font-size:15px; line-height:1.4; transition:border-color .12s, background .12s
}
.opt:hover:not(:disabled){border-color:var(--ink-2)}
.opt .mk{font-family:var(--f-mono); font-size:12px; font-weight:600; width:18px; flex:none;
  color:var(--muted); padding-top:2px}
.opt[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}
.opt[aria-pressed="true"] .mk{color:var(--accent)}
.opt.right{border-color:var(--ok-line); background:var(--ok-soft)}
.opt.right .mk{color:var(--ok)}
.opt.wrong{border-color:var(--bad-line); background:var(--bad-soft)}
.opt.wrong .mk{color:var(--bad)}
.opt:disabled{cursor:default}

/* Zuordnung */
.match{display:flex; flex-direction:column; gap:8px}
.mrow{display:flex; gap:8px; align-items:stretch; flex-wrap:wrap}
.mleft{
  flex:0 0 190px; padding:10px 12px; border:1px solid var(--line-strong); border-radius:8px;
  background:var(--surface); font-size:14px; line-height:1.35; text-align:left
}
.mleft[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}
.mslot{
  flex:1; min-width:150px; padding:10px 12px; border:1px dashed var(--line-strong); border-radius:8px;
  background:var(--surface-2); font-size:14px; line-height:1.35; text-align:left; color:var(--muted)
}
.mslot.filled{border-style:solid; color:var(--ink); background:var(--surface)}
.mslot.right{border-color:var(--ok-line); background:var(--ok-soft); color:var(--ink)}
.mslot.wrong{border-color:var(--bad-line); background:var(--bad-soft); color:var(--ink)}
@media (max-width:560px){ .mleft{flex-basis:100%} }
.bank{display:flex; gap:7px; flex-wrap:wrap; margin-top:12px; padding-top:12px; border-top:1px solid var(--line)}
.tok{
  padding:7px 11px; border:1px solid var(--line-strong); border-radius:7px; background:var(--surface);
  font-size:13.5px; line-height:1.3; text-align:left; max-width:100%
}
.tok:hover:not(:disabled){border-color:var(--ink-2)}
.tok:disabled{opacity:.35; cursor:default}

/* Reihenfolge */
.seq{display:flex; flex-direction:column; gap:7px}
.seqrow{display:flex; gap:10px; align-items:center; padding:10px 12px; border-radius:8px;
  border:1px solid var(--line-strong); background:var(--surface); font-size:14.5px; line-height:1.35; text-align:left; width:100%}
.seqrow .num{font-family:var(--f-mono); font-size:12px; font-weight:600; color:var(--muted); width:16px; flex:none}
.seqrow.right{border-color:var(--ok-line); background:var(--ok-soft)}
.seqrow.right .num{color:var(--ok)}
.seqrow.wrong{border-color:var(--bad-line); background:var(--bad-soft)}
.seqrow.wrong .num{color:var(--bad)}
.seqrow .corr{margin-left:auto; font-family:var(--f-mono); font-size:11px; color:var(--bad); flex:none}

/* Karteikarte */
.flip{padding:16px; border:1px solid var(--line-strong); border-radius:8px; background:var(--surface-2);
  font-size:16px; line-height:1.5}
.selfrate{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px}
.rate{flex:1; min-width:104px; padding:10px 12px; border-radius:8px; border:1px solid var(--line-strong);
  font-family:var(--f-display); font-weight:500; font-size:13.5px; background:var(--surface)}
.rate.g:hover{border-color:var(--ok); color:var(--ok)}
.rate.y:hover{border-color:var(--warn); color:var(--warn)}
.rate.r:hover{border-color:var(--bad); color:var(--bad)}

/* Auswertung einer Frage */
.verdict{display:flex; align-items:center; gap:9px; margin-top:16px; padding-top:15px; border-top:1px solid var(--line)}
.verdict .mark{font-family:var(--f-display); font-weight:600; font-size:15px}
.verdict.ok .mark{color:var(--ok)}
.verdict.part .mark{color:var(--warn)}
.verdict.no .mark{color:var(--bad)}
.expl{margin-top:9px; font-size:15px; line-height:1.55; color:var(--ink-2)}
.src{margin-top:10px; font-family:var(--f-mono); font-size:11px; color:var(--muted); line-height:1.5}
.qfoot{display:flex; gap:10px; align-items:center; margin-top:18px; flex-wrap:wrap}
.qfoot .right{margin-left:auto}

/* Ergebnis */
.result{max-width:720px; margin:0 auto; padding-block:30px 48px}
.scorebig{font-family:var(--f-display); font-size:clamp(46px,11vw,72px); font-weight:600;
  letter-spacing:-.03em; line-height:1; font-variant-numeric:tabular-nums}
.resgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); gap:10px; margin-top:22px}
.restile{padding:13px 14px; border:1px solid var(--line); border-radius:var(--r); background:var(--surface)}
.restile b{display:block; font-family:var(--f-display); font-size:22px; font-weight:600;
  font-variant-numeric:tabular-nums; line-height:1.1}
.revlist{display:flex; flex-direction:column; gap:1px; background:var(--line);
  border:1px solid var(--line); border-radius:var(--r); overflow:hidden; margin-top:10px}
.rev{display:flex; gap:11px; padding:11px 14px; background:var(--surface); align-items:flex-start;
  font-size:14px; line-height:1.4}
.rev .st{font-family:var(--f-mono); font-size:12px; font-weight:600; flex:none; width:22px}
.rev.ok .st{color:var(--ok)}
.rev.part .st{color:var(--warn)}
.rev.no .st{color:var(--bad)}
.rev .q{flex:1; min-width:0; font-family:var(--f-display)}

<script>
/* ------------------------------------------------------------------ *
 *  Study Lane — Prüfungstrainer über den Obsidian-Fragenpool
 * ------------------------------------------------------------------ */

const MODULE = {
  OGPM: "Geschäfts\u00ADprozess\u00ADmanagement",   // \u00AD = weiches Trennzeichen für die schmale Modulkarte
  GENE: "Gesellschaft, Politik, Wirtschaftsgeografie",
  SYMG: "Systemisches Management",
  VHRE: "Vertrags- und Haftpflichtrecht",
  WSA1: "Wissenschaftliches Arbeiten",
  EPC1: "English for Professional Communication"
};
const MOD_ORDER = ["OGPM","GENE","SYMG","VHRE","WSA1","EPC1"];
const KAT = {
  vorlesung:"Vorlesung", literatur:"Literatur", uebung:"Übung",
  organisation:"Organisation", richtlinie:"Richtlinie", vorlage:"Vorlage"
};
const TYP = { mc:"Multiple Choice", flash:"Karteikarte", match:"Zuordnung", order:"Reihenfolge" };
const MODI = {
  mix:    ["Gemischt",           "Zufällige Auswahl aus dem Filter"],
  schwach:["Schwachstellen",     "Zuerst das, was zuletzt schiefging"],
  neu:    ["Nur neue",           "Fragen, die du noch nie gesehen hast"],
  falsch: ["Nur Fehler",         "Nur Fragen, die du zuletzt nicht konntest"]
};
const LS_KEY = "lernstand.v1";

let POOL = [], META = {}, db = null, dbReady = false;
let stats = {};      // { fragenId: {v:versuche, p:punkte, t:ts, ok:letzterScore} }
let runs = [];       // [{id, ts, scope, total, punkte, dauer}]
let view = "dash";          // dash | modul | konto | quiz | result
let aktivesModul = null;    // welches Modul die Modulseite zeigt
let filterOffen = false;    // liegt das Filterblatt über der Seite?
let session = null;

const filter = {
  modul:new Set(), woche:new Set(), kategorie:new Set(), typ:new Set(),
  lernziel:null, nurKern:false, modus:"mix", laenge:15
};

/* ---------- Vorlagen ----------
 * Wer jeden Abend dieselben Filter neu zusammenklickt, lernt weniger. Eine
 * Vorlage merkt sich eine Einstellung; ein Klick setzt sie und startet die
 * Runde sofort. Zusätzlich überlebt die zuletzt benutzte Einstellung das
 * Schliessen des Tabs.
 *
 * Beides liegt bewusst nur lokal: es sind Gewohnheiten dieses Geräts, kein
 * Lernstand. Eine eigene Tabelle dafür wäre ausserdem riskant, solange eine
 * der PostgREST-Instanzen ihren Schema-Cache nicht erneuert — sie kennt neue
 * Tabellen nicht (siehe README). */
const LS_FILTER  = "lernstand.filter.v1";
const LS_VORLAGE = "lernstand.vorlagen.v1";

const VORLAGEN_FEST = [
  { id:"v-kern",    name:"Kernstoff quer",  f:{ nurKern:true, modus:"mix",     laenge:15 } },
  { id:"v-schwach", name:"Wo es klemmt",    f:{                modus:"schwach", laenge:15 } },
  { id:"v-neu",     name:"Noch nie geübt",  f:{                modus:"neu",     laenge:15 } },
];

/** Der Filter als schlichtes Objekt — so geht er durch JSON. */
function filterLesen(){
  return { modul:[...filter.modul], woche:[...filter.woche], kategorie:[...filter.kategorie],
           typ:[...filter.typ], lernziel:filter.lernziel, nurKern:filter.nurKern,
           modus:filter.modus, laenge:filter.laenge };
}

/** Umgekehrt — und dabei alles verwerfen, was der Fragenpool nicht mehr hergibt. */
function filterSetzen(f){
  f = f || {};
  const da = (feld, wert) => POOL.some(q => String(q[feld]) === String(wert));
  filter.modul     = new Set((f.modul||[]).filter(m=>da("modul",m)));
  filter.woche     = new Set((f.woche||[]).map(String).filter(w=>da("woche",w)));
  filter.kategorie = new Set((f.kategorie||[]).filter(k=>da("kategorie",k)));
  filter.typ       = new Set((f.typ||[]).filter(t=>da("typ",t)));
  filter.lernziel  = f.lernziel && da("lernziel", f.lernziel) ? f.lernziel : null;
  filter.nurKern   = !!f.nurKern;
  filter.modus     = MODI[f.modus] ? f.modus : "mix";
  filter.laenge    = [10,15,25,0].includes(f.laenge) ? f.laenge : 15;
}

function filterSichern(){
  try{ localStorage.setItem(LS_FILTER, JSON.stringify(filterLesen())); }catch(e){}
}
function filterLaden(){
  try{
    const roh = localStorage.getItem(LS_FILTER);
    if(roh) filterSetzen(JSON.parse(roh));
  }catch(e){ /* privates Fenster o. ä. — dann eben die Vorgabe */ }
}

function vorlagenEigen(){
  try{ const l = JSON.parse(localStorage.getItem(LS_VORLAGE)||"[]"); return Array.isArray(l)?l:[]; }
  catch(e){ return []; }
}
function vorlagenSichern(l){
  try{ localStorage.setItem(LS_VORLAGE, JSON.stringify(l.slice(0,12))); }catch(e){}
}
function vorlagenAlle(){
  return [...VORLAGEN_FEST.map(v=>({...v, eigen:false})),
          ...vorlagenEigen().map(v=>({...v, eigen:true}))];
}

/** Wie viele Fragen käme diese Vorlage bringen? Kurz einsetzen, zählen, zurück. */
function vorlagenAnzahl(f){
  const zurueck = filterLesen();
  filterSetzen(f);
  const n = roundSize(candidates());
  filterSetzen(zurueck);
  return n;
}

// Fragen zur Modulorganisation (Notengewichtung, Abgabetermine, Semesterplan)
// zielen auf kein benanntes Lernziel — sie tragen das ersatzweise vergebene
// Lernziel "Modulorganisation und Leistungsnachweis kennen".
const OHNE_LERNZIEL = "organisation";

/* ---------- Hilfsfunktionen ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (a,b)=> b>0 ? Math.round(a/b*100) : 0;
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const uid = ()=> Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function fmtDate(ts){
  const d=new Date(ts), n=new Date();
  const sameDay = d.toDateString()===n.toDateString();
  const t = d.toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit"});
  return sameDay ? "heute "+t : d.toLocaleDateString("de-CH",{day:"2-digit",month:"2-digit"})+" "+t;
}
function fmtDauer(ms){
  const s=Math.round(ms/1000);
  return s<60 ? s+" s" : Math.floor(s/60)+":"+String(s%60).padStart(2,"0")+" min";
}
function quoteColor(q){ return q>=.8 ? "var(--ok)" : q>=.6 ? "var(--warn)" : "var(--bad)"; }

/* ---------- Speicher ---------- */
function loadLocal(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ const o=JSON.parse(raw); stats=o.stats||{}; runs=o.runs||[]; }
  }catch(e){ /* privates Fenster o. ä. — läuft ohne */ }
}
function saveLocal(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({stats, runs:runs.slice(-60)})); }catch(e){}
}
function mergeStats(a,b){
  const out = Object.assign({}, a);
  for(const [id,e] of Object.entries(b||{})){
    const cur = out[id];
    if(!cur || (e.v||0) > (cur.v||0)) out[id] = e;
  }
  return out;
}
/* ---------- Neon-Sync (Handy und PC am selben Stand) ----------
 * Die Seite spricht über Neons Data API mit der Datenbank — PostgREST über
 * HTTPS, kein Verbindungsstring im Browser.
 *
 * Ohne Anmeldung läuft alles über einen anonymen Token, den das SDK selbst
 * holt — das ist der offene, gemeinsame Lernstand, den jeder sehen und ändern
 * kann. Wer sich anmeldet, bekommt seinen eigenen: Row Level Security in der
 * Datenbank lässt Angemeldete ausschliesslich an ihre eigenen Zeilen.
 */
const NEON_AUTH_URL = "https://ep-snowy-king-b12lj86r.neonauth.c-5.eu-central-1.aws.neon.tech/neondb/auth";
const NEON_DATA_URL = "https://ep-snowy-king-b12lj86r.apirest.c-5.eu-central-1.aws.neon.tech/neondb/rest/v1";
const NEON_SDK      = "https://esm.sh/@neondatabase/neon-js@0.7.0-beta";

let neon = null, neonBereit = false;

/* Wer ist angemeldet? Nur für die Anzeige — wem eine Zeile gehört, entscheidet
 * die Datenbank anhand des Tokens, nicht die App. */
let benutzer = null;                        // { id, name, email } oder null

function statusSetzen(an, text){
  const d = $("#dot"), t = $("#syncTxt");
  if(d) d.classList.toggle("on", !!an);
  if(t) t.textContent = text;
}

/** Wandelt eine Datenbankzeile in den Eintrag um, den die App im Speicher hält. */
function zeileZuEintrag(z){
  return {
    v:  Number(z.versuche) || 0,
    p:  Number(z.punkte)   || 0,
    t:  z.zuletzt ? Date.parse(z.zuletzt) : 0,
    ok: z.letzter_score === null || z.letzter_score === undefined ? 0 : Number(z.letzter_score),
  };
}

/** Baut den Client einmalig auf und liest eine bestehende Sitzung ein. */
async function neonClient(){
  if(neon) return neon;
  const { createClient } = await import(NEON_SDK);
  neon = createClient({
    auth:    { url: NEON_AUTH_URL, allowAnonymous: true },
    dataApi: { url: NEON_DATA_URL },
  });
  try{
    const s = await neon.auth.getSession();
    const u = s?.data?.user ?? s?.user ?? null;
    benutzer = (u && u.id) ? { id: u.id, name: u.name || "", email: u.email || "" } : null;
  }catch(e){ benutzer = null; /* keine Sitzung — dann anonym */ }
  return neon;
}

async function initNeon(){
  statusSetzen(false, "verbinde …");
  try{
    await neonClient();

    const [f, r] = await Promise.all([
      neon.from("fortschritt").select("*"),
      neon.from("runden").select("*").order("ts", { ascending: true }).limit(200),
    ]);
    if(f.error) throw new Error(f.error.message || "Lesefehler");
    if(r.error) throw new Error(r.error.message || "Lesefehler");

    const fern = {};
    for(const z of (f.data || [])) fern[z.frage_id] = zeileZuEintrag(z);
    stats = mergeStats(stats, fern);

    const bekannt = new Set(runs.map(x=>x.id));
    for(const z of (r.data || [])){
      if(z && z.id && !bekannt.has(z.id)) runs.push({
        id: z.id, ts: Number(z.ts), scope: z.scope, total: z.total,
        punkte: Number(z.punkte), dauer: z.dauer, fragen: z.fragen || [],
      });
    }
    runs.sort((a,b)=>a.ts-b.ts);

    neonBereit = true;
    saveLocal();
    statusSetzen(true, benutzer ? (benutzer.name || "angemeldet") : "offen");
    if(view==="dash") render();
    await pushNeon();          // lokalen Stand gleich mit hochschieben
    return true;
  }catch(e){
    neonBereit = false;
    statusSetzen(false, "offline");
    return false;
  }
}

/** Nach An- oder Abmeldung: lokalen Stand verwerfen und den des neuen
 *  Kontos holen — sonst würde fremder Fortschritt mitwandern. */
async function benutzerWechsel(){
  stats = {}; runs = [];
  try{ localStorage.removeItem(LS_KEY); }catch(e){}
  // Client verwerfen: nach dem Abmelden hält er noch den alten Token und
  // holt sich sonst keinen frischen anonymen. neonClient() liest die Sitzung
  // danach neu ein und setzt `benutzer` massgeblich.
  neon = null;
  neonBereit = false;
  await initNeon();
  render();
}

/* Die Benutzerkennung schreibt die Datenbank selbst: benutzer_id hat als
 * Vorgabewert coalesce(auth.user_id(),'anonym'). Sie steht deshalb absichtlich
 * in keinem Datensatz hier — sie kommt aus dem geprüften Token statt aus dem
 * Browser, und die App bleibt unabhängig davon, ob die Data API ihren
 * Schema-Cache schon erneuert hat. Getrennt wird ohnehin per Row Level
 * Security, nicht durch das, was die App mitschickt. */
async function pushNeon(){
  if(!neonBereit || !neon) return;
  try{
    const fragen = Object.entries(stats).map(([id,e])=>({
      frage_id: id,
      versuche: e.v || 0,
      punkte:   e.p || 0,
      letzter_score: e.ok ?? null,
      zuletzt:  new Date(e.t || Date.now()).toISOString(),
    }));
    if(fragen.length){
      // Upsert: vorhandene Zeilen werden ersetzt. Der Abgleich beim Start hat
      // den Serverstand bereits eingemischt, deshalb ist der lokale Stand hier
      // der jeweils vollständigere.
      const u = await neon.from("fortschritt").upsert(fragen, { onConflict: "benutzer_id,frage_id" });
      if(u.error) throw new Error(u.error.message);
    }

    const neueRunden = runs.slice(-200).map(r=>({
      id: r.id, ts: r.ts, scope: r.scope || "", total: r.total,
      punkte: r.punkte, dauer: r.dauer, fragen: r.fragen || [],
    }));
    if(neueRunden.length){
      const u = await neon.from("runden").upsert(neueRunden, { onConflict: "id" });
      if(u.error) throw new Error(u.error.message);
    }

    statusSetzen(true, benutzer ? (benutzer.name || "angemeldet") : "offen");
  }catch(e){
    statusSetzen(false, "nicht gesichert");
  }
}

async function initDB(){
  let cap = null;
  try{ cap = await window.claude?.use?.("db") ?? null; }catch(e){ cap = null; }
  if(!cap) return;
  db = cap;
  try{
    const snap = await db.doc("fortschritt/stats").get();
    const body = snap && snap.exists ? snap.data() : null;
    if(body && body.eintraege) stats = mergeStats(stats, body.eintraege);

    const rs = await db.collection("runden").orderBy("ts","desc").limit(60).get();
    const remote = (rs && rs.docs ? rs.docs : []).map(d=>d.data()).filter(Boolean);
    const seen = new Set(runs.map(r=>r.id));
    for(const r of remote) if(r && r.id && !seen.has(r.id)) runs.push(r);
    runs.sort((a,b)=>a.ts-b.ts);
    dbReady = true;
    saveLocal();
    $("#dot").classList.add("on");
    $("#syncTxt").textContent = "gespeichert";
    if(view==="dash") render();
  }catch(e){
    $("#syncTxt").textContent = "lokal";
  }
}
async function pushDB(run){
  if(!db) return;
  try{
    await db.doc("fortschritt/stats").set({ aktualisiert: Date.now(), eintraege: stats });
    if(run) await db.doc("runden/"+run.id).set(run);
  }catch(e){ /* Schreibrecht fehlt — lokal bleibt erhalten */ }
}

/* ---------- Auswahl ---------- */
function matchesFilter(q){
  if(filter.modul.size && !filter.modul.has(q.modul)) return false;
  if(filter.woche.size && !filter.woche.has(String(q.woche))) return false;
  if(filter.kategorie.size && !filter.kategorie.has(q.kategorie)) return false;
  if(filter.typ.size && !filter.typ.has(q.typ)) return false;
  if(filter.lernziel && q.lernziel !== filter.lernziel) return false;
  if(filter.nurKern && !q.kern) return false;
  return true;
}
function passtModus(q){
  if(filter.modus==="neu")    return !stats[q.id];
  if(filter.modus==="falsch") return !!(stats[q.id] && stats[q.id].ok < 1);
  return true;
}
function candidates(){
  return POOL.filter(q=>matchesFilter(q) && passtModus(q));
}
/** Alle Fragen, die jeden aktiven Filter ausser `dim` erfüllen. Grundlage für die
 *  Zahlen auf den Chips: Innerhalb einer Zeile ist die Auswahl ein Oder, deshalb
 *  darf die eigene Zeile nicht mitfiltern, sonst stünde bei jedem anderen Modul 0,
 *  sobald eines gewählt ist. */
function basisOhne(dim){
  return POOL.filter(q=>{
    if(dim!=="modul"     && filter.modul.size     && !filter.modul.has(q.modul)) return false;
    if(dim!=="woche"     && filter.woche.size     && !filter.woche.has(String(q.woche))) return false;
    if(dim!=="kategorie" && filter.kategorie.size && !filter.kategorie.has(q.kategorie)) return false;
    if(dim!=="typ"       && filter.typ.size       && !filter.typ.has(q.typ)) return false;
    if(dim!=="lernziel"  && filter.lernziel       && q.lernziel !== filter.lernziel) return false;
    if(dim!=="kern"      && filter.nurKern        && !q.kern) return false;
    return passtModus(q);
  });
}
function pickRound(){
  let c = candidates();
  if(filter.modus==="schwach"){
    c = c.slice().sort((a,a2)=>{
      const sa=stats[a.id], sb=stats[a2.id];
      const qa = sa ? sa.p/sa.v : -1, qb = sb ? sb.p/sb.v : -1;   // ungeübt ganz vorn
      if(qa!==qb) return qa-qb;
      return (sa?sa.t:0)-(sb?sb.t:0);
    });
  } else {
    c = shuffle(c);
  }
  const n = filter.laenge===0 ? c.length : Math.min(filter.laenge, c.length);
  return c.slice(0,n);
}
function filterAktiv(){
  return filter.modul.size>0 || filter.woche.size>0 || filter.kategorie.size>0
      || filter.typ.size>0 || !!filter.lernziel || filter.nurKern || filter.modus!=="mix";
}
function roundSize(c){
  return filter.laenge===0 ? c.length : Math.min(filter.laenge, c.length);
}
function scopeLabel(){
  const p=[];
  // Ein Lernziel gehört immer zu genau einem Modul — dann wäre "Alle Module" irreführend.
  const zielModul = filter.lernziel ? POOL.find(q=>q.lernziel===filter.lernziel)?.modul : null;
  p.push(filter.modul.size ? [...filter.modul].join(" · ") : (zielModul || "Alle Module"));
  if(filter.woche.size) p.push("Woche "+[...filter.woche].sort().join("/"));
  if(filter.kategorie.size) p.push([...filter.kategorie].map(k=>KAT[k]||k).join("/"));
  if(filter.typ.size) p.push([...filter.typ].map(t=>TYP[t]||t).join("/"));
  if(filter.nurKern) p.push("nur Kernstoff");
  if(filter.lernziel) p.push("Lernziel: "+filter.lernziel);
  if(filter.modus!=="mix") p.push(MODI[filter.modus][0]);
  return p.join(" — ");
}

/* ---------- Serie ----------
 * Donnerstag und Freitag sind frei — an den übrigen fünf Tagen zählt, ob das
 * Tagesziel erreicht wurde. Pro Kalenderwoche deckt ein Joker genau einen
 * verpassten Pflichttag; der zweite bricht die Serie.
 *
 * Alles wird aus `runs` abgeleitet und nirgends gespeichert. Das hat zwei
 * Vorteile: die Serie gleicht sich ohne eigene Tabelle über Neon mit ab, und
 * sie kann nicht auseinanderlaufen — es gibt keinen zweiten Stand, der falsch
 * werden könnte.
 *
 * Gezählt werden beantwortete Fragen (run.total), nicht Runden. Eine nach zwei
 * Fragen abgebrochene Runde soll keinen Tag retten.
 */
const PFLICHTTAGE = [1, 2, 3, 6, 0];   // Mo Di Mi Sa So — getDay(): Sonntag ist 0
const TAGESZIEL   = 10;                // beantwortete Fragen pro Pflichttag
const TAGKURZ     = ["So","Mo","Di","Mi","Do","Fr","Sa"];

const tagKey = (d) => d.getFullYear() + "-" +
  String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const istPflicht = (d) => PFLICHTTAGE.includes(d.getDay());

/** Montag der Woche, in der d liegt — der Joker hängt an diesem Schlüssel. */
function wochenKey(d){
  const x = new Date(d);
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return tagKey(x);
}

/** { "2026-10-08": 15, … } — beantwortete Fragen je Kalendertag. */
function fragenProTag(){
  const m = {};
  for(const r of runs){
    if(!r || !r.ts) continue;
    const k = tagKey(new Date(r.ts));
    m[k] = (m[k] || 0) + (Number(r.total) || 0);
  }
  return m;
}

/** Alles, was die Anzeige über die Serie braucht. */
function serienStand(){
  const proTag = fragenProTag();
  const heute = new Date(); heute.setHours(0,0,0,0);
  const heuteKey = tagKey(heute);
  const erledigt = (k) => (proTag[k] || 0) >= TAGESZIEL;

  // --- Die laufende Kette, rückwärts von heute ---------------------------
  // Der Joker rettet den jeweils jüngsten Ausfall einer Woche; trifft die
  // Suche in derselben Woche auf einen zweiten, ist die Serie dort zu Ende.
  let serie = 0, gerettet = 0;
  const jokerWeg = new Set();
  const lauf = new Date(heute);
  for(let i = 0; i < 800; i++){
    const k = tagKey(lauf);
    if(istPflicht(lauf)){
      if(erledigt(k)) serie++;
      else if(k !== heuteKey){          // der laufende Tag ist nicht verpasst, nur offen
        const w = wochenKey(lauf);
        if(jokerWeg.has(w)) break;
        jokerWeg.add(w); gerettet++;
      }
    }
    lauf.setDate(lauf.getDate() - 1);
  }

  // --- Rekord: dieselbe Regel vorwärts über die ganze Vergangenheit ------
  let rekord = serie;
  if(runs.length){
    const d = new Date(Math.min(...runs.map(r => r.ts)));
    d.setHours(0,0,0,0);
    let kette = 0;
    const jokerVerbraucht = new Set();
    while(d <= heute){
      const k = tagKey(d);
      if(istPflicht(d) && k !== heuteKey){
        if(erledigt(k)) { kette++; if(kette > rekord) rekord = kette; }
        else {
          const w = wochenKey(d);
          if(jokerVerbraucht.has(w)) kette = 0;   // zweiter Ausfall der Woche
          else jokerVerbraucht.add(w);
        }
      }
      d.setDate(d.getDate() + 1);
    }
  }

  // --- Die laufende Woche, Montag bis Sonntag ----------------------------
  const montag = new Date(heute);
  montag.setDate(montag.getDate() - ((montag.getDay() + 6) % 7));
  const woche = [];
  for(let i = 0; i < 7; i++){
    const d = new Date(montag); d.setDate(montag.getDate() + i);
    const k = tagKey(d);
    woche.push({
      kurz: TAGKURZ[d.getDay()], fragen: proTag[k] || 0, heute: k === heuteKey,
      status: !istPflicht(d) ? "frei"
            : erledigt(k)    ? "erledigt"
            : k === heuteKey ? "heute"
            : d > heute      ? "kommend"
                             : "ausfall",   // welcher davon der Joker deckt, gleich unten
    });
  }
  // Gerettet wird der jüngste Ausfall — genau wie beim Rückwärtslaufen oben.
  const ausfaelle = woche.map((t,i)=>t.status==="ausfall"?i:-1).filter(i=>i>=0);
  ausfaelle.forEach((i, n) => { woche[i].status = n === ausfaelle.length-1 ? "gerettet" : "verpasst"; });

  return {
    serie, gerettet, rekord,
    heuteFragen: proTag[heuteKey] || 0,
    heutePflicht: istPflicht(heute),
    jokerFrei: ausfaelle.length === 0,
    woche,
  };
}

/** Der Serienstreifen auf der Übersicht. */
function serienKarte(){
  const s = serienStand();
  const offen = Math.max(0, TAGESZIEL - s.heuteFragen);
  const satz = !s.heutePflicht
    ? (s.heuteFragen ? `Freier Tag — und trotzdem ${s.heuteFragen} Fragen.`
                     : "Heute ist frei.")
    : offen === 0 ? `Heute geschafft — ${s.heuteFragen} Fragen.`
                  : `Noch ${offen} von ${TAGESZIEL} Fragen für heute.`;

  return `
  <section>
    <div class="card panel serie">
      <div class="seriekopf">
        <div class="seriezahl"><b>${s.serie}</b><span class="eyebrow">Tage-Serie</span></div>
        <div class="seriesatz">
          <p>${esc(satz)}</p>
          <p class="pool">${s.jokerFrei ? "Joker diese Woche noch frei" : "Joker diese Woche verbraucht"}${
            s.rekord > s.serie ? ` · Rekord ${s.rekord}` : ""}</p>
        </div>
      </div>
      <div class="seriewoche">
        ${s.woche.map(t=>`<div class="stag ${t.status}${t.heute?" ist-heute":""}"
          title="${t.kurz}: ${t.status === "frei" ? "frei" : t.fragen + " von " + TAGESZIEL + " Fragen"}">
          <span class="sk">${t.kurz}</span><span class="sp"></span>
        </div>`).join("")}
      </div>
    </div>
  </section>`;
}

/* ---------- Statistik ---------- */
function statFor(list){
  let v=0,p=0,seen=0;
  for(const q of list){ const s=stats[q.id]; if(s){ seen++; v+=s.v; p+=s.p; } }
  return { total:list.length, geuebt:seen, versuche:v, punkte:p, quote: v? p/v : 0 };
}
function goalStats(){
  const m = new Map();
  for(const q of POOL){
    const k = q.modul+"||"+q.lernziel;
    if(!m.has(k)) m.set(k,{modul:q.modul, ziel:q.lernziel, total:0, geuebt:0, v:0, p:0});
    const g = m.get(k); g.total++;
    const s = stats[q.id];
    if(s){ g.geuebt++; g.v+=s.v; g.p+=s.p; }
  }
  return [...m.values()].map(g=>Object.assign(g,{quote: g.v? g.p/g.v : null}));
}

/* ================= SEITENWECHSEL ================= */
function render(){
  filterSichern();   // jede Filteränderung läuft hier durch
  if(view==="quiz")        renderQuiz();
  else if(view==="result") renderResult();
  else if(view==="konto")  renderKonto();
  else if(view==="modul" && aktivesModul) renderModul();
  else                     renderDash();
  kopfzeile();
  qfootFreiraum();
}

/* Auf dem Handy liegt die Prüfen-Leiste fest am unteren Rand. Wie hoch sie
 * ist, hängt davon ab, ob der Hinweis daneben umbricht — je nach Fragetyp.
 * Statt einen Wert zu raten, misst die Seite ihn und hält den Freiraum
 * darunter selbst nach. */
function qfootFreiraum(){
  const w = document.querySelector(".qwrap"), f = document.querySelector(".qwrap .qfoot");
  if(!w) return;
  if(!f || getComputedStyle(f).position !== "fixed"){ w.style.removeProperty("--qfoot-h"); return; }
  w.style.setProperty("--qfoot-h", Math.ceil(f.getBoundingClientRect().height) + "px");
}
new ResizeObserver(qfootFreiraum).observe(document.documentElement);

/* ---------- Seiten ----------
 * Die Übersicht zeigt fast nur die Module. Alles Weitere liegt dahinter: ein
 * Modul öffnet seine eigene Seite mit fertigen Runden, die vollständige
 * Zusammenstellung steckt hinter dem Filter-Knopf. Vorher kostete jeder Start
 * fünf Klicks durch eine Filterwand. */

/** Filter setzen und sofort loslegen — der Weg fast aller Knöpfe hier. */
function startMit(f){ filterSetzen(f); filterOffen = false; startRound(); }

function zurDash(){ view="dash"; aktivesModul=null; filterOffen=false; scrollTo(0,0); render(); }
function zumModul(m){ view="modul"; aktivesModul=m; filterOffen=false; scrollTo(0,0); render(); }
function zumKonto(){ view="konto"; filterOffen=false; scrollTo(0,0); render(); }

/** Läuft gerade eine Runde, die noch nicht zu Ende ist? */
function offeneRunde(){ return !!session && session.i < session.qs.length; }

/** Die Kopfzeile gehört zu keiner Seite und wird nach jedem Render nachgezogen. */
function kopfzeile(){
  const k = $("#kontoAuf");
  if(k) k.classList.toggle("aktiv", view==="konto");
}

/** Eine Modulkachel — auf der Übersicht führt sie auf die Modulseite. */
function modulKachel(m){
  const list = POOL.filter(q=>q.modul===m), s = statFor(list);
  const good = s.versuche ? s.punkte/s.versuche : 0;
  const coverage = s.geuebt/s.total;
  return `<button class="modcard mod" style="--mc:var(--m-${m})" data-mod="${m}">
    <span class="code">${m}</span>
    <span class="sub">${esc(MODULE[m]||"")}</span>
    <span class="meter">
      <i class="a" style="width:${(coverage*good*100).toFixed(1)}%"></i>
      <i class="b" style="width:${(coverage*(1-good)*100).toFixed(1)}%"></i>
    </span>
    <span class="nums"><span>${s.geuebt}/${s.total} geübt</span><span>${s.versuche? Math.round(good*100)+"%" : "–"}</span></span>
  </button>`;
}

/** Ein Knopf, der eine fertige Runde startet. Ohne Fragen bleibt er aus. */
function startKachel(name, hinweis, f){
  const n = vorlagenAnzahl(f);
  return `<div class="vorlage">
    <button class="vgo" data-start-f="${esc(JSON.stringify(f))}" ${n?"":"disabled"}>
      <b>${esc(name)}</b><span class="n">${n ? n+" Frage"+(n===1?"":"n") : esc(hinweis)}</span>
    </button>
  </div>`;
}

/* ---------- Eine Modulseite ---------- */

    .sort((a,b)=>(a.quote===null)-(b.quote===null) || (a.quote??0)-(b.quote??0));

  ${wochen.length>1 ? `

        <span class="txt">${esc(g.ziel)}</span>
        ${g.quote===null ? "" : `<span class="bar"><i style="width:${Math.round(g.quote*100)}%"></i></span>`}

/* ---------- Das Filterblatt ----------
 * Die vollständige Zusammenstellung. Sie liegt bewusst unter einem Knopf: wer
 * schnell starten will, soll sie nie zu Gesicht bekommen. */
function filterBlatt(){
  if(!filterOffen) return "";
  const cand = candidates();
  // Zahl pro Chip: so viele Fragen kämen mit diesem Wert zur übrigen Auswahl dazu.
  const basis = {}; ["modul","woche","kategorie","typ","lernziel","kern"].forEach(d=>basis[d]=basisOhne(d));
  const zahl = (dim, fn) => basis[dim].filter(fn).length;
  const chip = (dim, v, label, n) =>
    `<button class="chip${n?"":" leer"}" data-f="${dim}" data-v="${esc(v)}" aria-pressed="${filter[dim].has(v)}">${label}<span class="n">${n}</span></button>`;
  const wochen = [...new Set(POOL.map(q=>String(q.woche)))].sort((a,b)=>a-b);
  const kats = [...new Set(POOL.map(q=>q.kategorie))]
    .sort((a,b)=> POOL.filter(q=>q.kategorie===b).length - POOL.filter(q=>q.kategorie===a).length);

  return `
  <div class="blattbg" id="blattZu"></div>
  <div class="blatt" role="dialog" aria-label="Runde zusammenstellen">
    <div class="blattkopf">
      <h2>Runde zusammenstellen</h2>
      <button class="blattx" id="blattZu2" aria-label="Schliessen">×</button>
    </div>
    <div class="blattkern">
      <div class="frow"><span class="flabel">Modul</span>
        ${MOD_ORDER.filter(m=>POOL.some(q=>q.modul===m)).map(m=>chip("modul", m, m, zahl("modul", q=>q.modul===m))).join("")}
      </div>
      <div class="frow"><span class="flabel">Woche</span>
        ${wochen.map(w=>chip("woche", w, "Woche "+w, zahl("woche", q=>String(q.woche)===w))).join("")}
      </div>
      <div class="frow"><span class="flabel">Quelle</span>
        ${kats.map(k=>chip("kategorie", k, KAT[k]||k, zahl("kategorie", q=>q.kategorie===k))).join("")}
      </div>
      <div class="frow"><span class="flabel">Fragetyp</span>
        ${Object.keys(TYP).map(t=>chip("typ", t, TYP[t], zahl("typ", q=>q.typ===t))).join("")}
      </div>
      <div class="frow"><span class="flabel">Lernziel</span>
        <select id="zielSel" class="sel${filter.lernziel?" aktiv":""}">
          <option value="">Alle Lernziele</option>
          ${MOD_ORDER.filter(m=>POOL.some(q=>q.modul===m)).map(m=>{
            const zl = [...new Set(POOL.filter(q=>q.modul===m && q.kategorie!==OHNE_LERNZIEL).map(q=>q.lernziel))].sort();
            return `<optgroup label="${m}">${zl.map(z=>{
              const n = zahl("lernziel", q=>q.modul===m && q.lernziel===z);
              return `<option value="${esc(z)}" ${filter.lernziel===z?"selected":""}>${esc(z)} (${n})</option>`;
            }).join("")}</optgroup>`;
          }).join("")}
        </select>
        <button class="chip" data-nurkern aria-pressed="${filter.nurKern}"
          title="Nur die Fragen, ohne die eine Standardfrage zum Lernziel nicht zu beantworten ist: Definitionen, Prüfschemata, Abgrenzungen.">Nur Kernstoff<span class="n">${zahl("kern", q=>q.kern)}</span></button>
      </div>
      <div class="frow"><span class="flabel">Modus</span>
        ${Object.entries(MODI).map(([k,v])=>`<button class="chip" data-modus="${k}" aria-pressed="${filter.modus===k}" title="${esc(v[1])}">${v[0]}</button>`).join("")}
      </div>
      <div class="frow"><span class="flabel">Länge</span>
        ${[10,15,25,0].map(n=>`<button class="chip" data-len="${n}" aria-pressed="${filter.laenge===n}">${n===0?"alle":n+" Fragen"}</button>`).join("")}
      </div>
      <div class="frow"><span class="flabel"></span>
        <button class="btn ghost sm" id="reset">Zurücksetzen</button>
        <button class="btn ghost sm" id="vNeu">Als Vorlage sichern</button>
      </div>
      <div class="vform" id="vForm" hidden>
        <input id="vName" type="text" maxlength="40" placeholder="Name der Vorlage">
        <button class="btn sm" id="vOk">Sichern</button>
        <button class="btn ghost sm" id="vAb">Abbrechen</button>
      </div>
      ${cand.length===0 ? `<p class="muted" style="font-size:13px; margin-top:10px">Diese Kombination ergibt keine Fragen — meist hilft es, den Modus auf „Gemischt“ zu stellen.</p>`:""}
    </div>
    <div class="blattfuss">
      <button class="btn" data-start ${cand.length?"":"disabled"}>Runde starten</button>
      <span class="pool">${cand.length} Frage${cand.length===1?"":"n"}${filter.laenge&&cand.length>filter.laenge?` · ${roundSize(cand)} in dieser Runde`:""}</span>
    </div>
  </div>`;
}

function bindFilterblatt(){

  const zu = ()=>{ filterOffen = false; render(); };
  $("#blattZu").onclick = zu;

    filter.lernziel=null; filter.nurKern=false; filter.modus="mix"; filter.laenge=15; render();

    filterOffen = false; render();
  };
  $("#vName").onkeydown = e=>{ if(e.key==="Enter") $("#vOk").click(); };
}

/* ---------- Anmeldung ----------
 * Neon Auth kennt nur Anmeldung per E-Mail. Verlangt wird hier trotzdem nur
 * ein Name: daraus wird eine feste, nie zustellbare Adresse gebildet, die
 * ausschliesslich als Schlüssel dient. Der Preis steht im Formular — ohne
 * echte Adresse gibt es kein Zurücksetzen eines vergessenen Passworts.
 *
 * Die Ableitung muss stabil bleiben: ändert sie sich, findet niemand sein
 * altes Konto wieder. "Jan B." und "jan-b" sind absichtlich dasselbe Konto. */
const KONTO_DOMAENE = "lernstand.local";
function nameSchluessel(n){
  return String(n||"").trim().toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "")   // ä → a
    .replace(/ß/g, "ss")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "");
}

function bindKonto(){
  const ab = $("#abmelden");
  if(ab){
    ab.onclick = async ()=>{
      ab.disabled = true; ab.textContent = "Melde ab …";
      try{ await (await neonClient()).auth.signOut(); }catch(e){}
      benutzer = null;
      await benutzerWechsel();
    };
    return;
  }

  const msg = $("#kontoMsg");
  if(!msg) return;
  const sag = t => { const m = $("#kontoMsg"); if(m) m.textContent = t; };

  /** Zieht die Fehlermeldung aus dem, was das SDK zurückgibt oder wirft. */
  const klartext = (e)=>{
    const t = (e && (e.message || e.error?.message || e.statusText)) || String(e || "");
    if(/already.*exist|USER_ALREADY/i.test(t))        return "Diesen Namen gibt es schon — melde dich an oder nimm einen anderen.";
    if(/password.*(short|length)|PASSWORD_TOO/i.test(t)) return "Das Passwort ist zu kurz, mindestens 8 Zeichen.";
    if(/invalid.*(email|password)|INVALID_CRED|INVALID_/i.test(t)) return "Name oder Passwort stimmt nicht.";
    if(/origin|domain/i.test(t))                      return "Diese Adresse ist bei Neon Auth nicht freigegeben.";
    return t.slice(0, 160) || "Unbekannter Fehler.";
  };

  const machen = async (art)=>{
    const name = ($("#kName")?.value || "").trim();
    const pass = $("#kPass")?.value || "";
    const kennung = nameSchluessel(name);
    if(kennung.length < 2) return sag("Bitte einen Namen mit mindestens zwei Zeichen.");
    if(pass.length < 8)    return sag("Das Passwort braucht mindestens 8 Zeichen.");
    const mail = kennung + "@" + KONTO_DOMAENE;

    sag(art === "neu" ? "Lege Konto an …" : "Melde an …");
    try{
      const c = await neonClient();
      const r = art === "neu"
        ? await c.auth.signUp.email({ email: mail, password: pass, name })
        : await c.auth.signIn.email({ email: mail, password: pass });
      if(r && r.error) return sag(klartext(r.error));

      const u = r?.data?.user ?? (await c.auth.getSession())?.data?.user ?? null;
      if(!u || !u.id) return sag("Anmeldung hat nicht geklappt.");
      benutzer = { id: u.id, name: u.name || name, email: u.email || mail };
      await benutzerWechsel();
    }catch(e){
      sag(klartext(e));
    }
  };

  $("#anmelden").onclick     = ()=>machen("an");
  $("#registrieren").onclick = ()=>machen("neu");
  $("#kPass").onkeydown = e=>{ if(e.key === "Enter") machen("an"); };
}

/* ---------- Sichern und einspielen ---------- */
function bindBackup(){
  const msg = $("#backupMsg"), box = $("#impBox"), act = $("#impActions");
  if(!msg) return;
  const say = t => { msg.textContent = t; };

  // --- Neon von Hand anstossen, falls beim Start das Netz fehlte ---
  const wieder = $("#neonRetry");
  if(wieder) wieder.onclick = async ()=>{
    const m = $("#neonMsg");
    if(m) m.textContent = "Gleiche ab …";
    const ok = await initNeon();
    render();
    const m2 = $("#neonMsg");
    if(m2) m2.textContent = ok ? "Abgeglichen." : "Kein Kontakt zur Datenbank.";
    const det = m2 && m2.closest("details"); if(det) det.open = true;
  };

  $("#expCopy").onclick = async ()=>{
    const text = JSON.stringify({app:"lernstand", v:1, stats, runs});
    try{
      await navigator.clipboard.writeText(text);
      say("Kopiert — auf dem anderen Gerät einspielen.");
    }catch(e){
      box.hidden=false; box.value=text; box.select();
      say("Zwischenablage gesperrt — Text ist markiert, mit Strg+C kopieren.");
    }
  };

  $("#impOpen").onclick = ()=>{
    box.hidden=false; act.hidden=false; box.value=""; box.focus(); say("");
  };

  $("#impGo").onclick = ()=>{
    let data;
    try{ data = JSON.parse(box.value); }
    catch(e){ return say("Das war kein gültiger Lernstand — bitte den ganzen kopierten Text einfügen."); }
    if(!data || data.app!=="lernstand" || !data.stats)
      return say("Das war kein gültiger Lernstand — bitte den ganzen kopierten Text einfügen.");

    const vorher = Object.keys(stats).length;
    stats = mergeStats(stats, data.stats);
    const seen = new Set(runs.map(r=>r.id));
    for(const r of (data.runs||[])) if(r && r.id && !seen.has(r.id)) runs.push(r);
    runs.sort((a,b)=>a.ts-b.ts);
    saveLocal(); pushDB(null); pushNeon();
    const dazu = Object.keys(stats).length - vorher;
    box.hidden=true; act.hidden=true;
    render();
    $("#backupMsg").textContent = dazu>0
      ? `Übernommen — ${dazu} zusätzliche Frage${dazu===1?"":"n"} im Lernstand.`
      : "Übernommen — der Lernstand war bereits auf diesem Stand.";
    $("#backupMsg").closest("details").open = true;
  };
}

/* ================= RUNDE ================= */
function startRound(){
  const qs = pickRound();
  if(!qs.length) return;
  session = { qs, i:0, scores:[], start:Date.now(), scope:scopeLabel(), state:null };
  view="quiz"; window.scrollTo(0,0); render();
}

function prepState(q){
  // Die Optionen werden pro Durchgang gemischt; `pick` und `loesung`
  // arbeiten weiter mit den Original-Indizes aus fragen.json.
  if(q.typ==="mc")    return { order:shuffle(q.optionen.map((_,i)=>i)), pick:new Set(), done:false };
  if(q.typ==="flash") return { shown:false, done:false };
  if(q.typ==="order") return { pool:shuffle(q.items.map((t,i)=>({t,i}))), seq:[], done:false };
  if(q.typ==="match") return { bank:shuffle(q.paare.map((p,i)=>({t:p[1],i}))), slots:new Array(q.paare.length).fill(null), sel:null, done:false };
  return { done:false };
}

function renderQuiz(){
  const s = session, q = s.qs[s.i];
  if(!s.state) s.state = prepState(q);
  const st = s.state;
  const multi = q.typ==="mc" && q.loesung.length>1;
  const punkte = s.scores.reduce((a,b)=>a+b,0);

  $("#app").innerHTML = `
  <div class="qwrap">
    <div class="qprog">
      <span class="eyebrow">Frage ${s.i+1} / ${s.qs.length}</span>
      <span class="rail"><i style="width:${(s.i)/s.qs.length*100}%"></i></span>
      <span class="mono" style="font-size:12px; color:var(--muted)">${punkte.toFixed(1).replace(/\.0$/,"")} Punkte</span>
      <button class="btn ghost sm" id="abort">Beenden</button>
    </div>

    <div class="card qcard" style="--mc:var(--m-${q.modul})">
      <div class="qmeta">
        <span class="badge mod">${q.modul}</span>
        <span class="badge">Woche ${q.woche}</span>
        <span class="badge">${KAT[q.kategorie]||q.kategorie}</span>
        <span class="badge">${TYP[q.typ]}</span>
        ${multi?`<span class="badge" style="color:var(--warn)">mehrere richtig</span>`:""}
      </div>
      <div class="qziel">${esc(q.lernziel)}</div>
      <h2 class="qtext">${esc(q.frage)}</h2>
      <div id="body"></div>
      <div id="after"></div>
    </div>
  </div>`;

  $("#abort").onclick = ()=>{ if(s.scores.length) finishRound(true); else { session=null; view="dash"; render(); } };
  drawBody(q, st);
  if(st.done) drawVerdict(q, st);
}

function drawBody(q, st){
  const b = $("#body");
  const dis = st.done ? "disabled" : "";

  if(q.typ==="mc"){
    b.innerHTML = `<div class="opts">${st.order.map((i,pos)=>{
      const buchstabe = String.fromCharCode(65+pos);
      let cls="opt";
      if(st.done){
        const correct = q.loesung.includes(i), chosen = st.pick.has(i);
        if(correct) cls+=" right"; else if(chosen) cls+=" wrong";
      }
      return `<button class="${cls}" ${dis} data-i="${i}" aria-pressed="${st.pick.has(i)}">
        <span class="mk">${st.done ? (q.loesung.includes(i)?"✓":(st.pick.has(i)?"✕":buchstabe)) : buchstabe}</span>
        <span>${esc(q.optionen[i])}</span></button>`;
    }).join("")}</div>
    ${st.done?"":`<div class="qfoot"><button class="btn" id="check" ${st.pick.size?"":"disabled"}>Prüfen</button>
      <span class="muted" style="font-size:13px">${q.loesung.length>1?`${q.loesung.length} Antworten auswählen`:"Eine Antwort auswählen"}</span></div>`}`;
    if(!st.done){
      b.querySelectorAll(".opt").forEach(el=>el.onclick=()=>{
        const i=+el.dataset.i;
        if(q.loesung.length===1) st.pick.clear();
        st.pick.has(i)?st.pick.delete(i):st.pick.add(i);
        drawBody(q,st);
      });
      $("#check").onclick = ()=>{
        const ok = st.pick.size===q.loesung.length && [...st.pick].every(i=>q.loesung.includes(i));
        answer(q, st, ok?1:0);
      };
    }
  }

  else if(q.typ==="flash"){
    b.innerHTML = st.shown
      ? `<div class="flip">${esc(q.antwort)}</div>
         ${st.done?"":`<div class="selfrate">
           <button class="rate g" data-s="1">Wusste ich</button>
           <button class="rate y" data-s="0.5">Ungefähr</button>
           <button class="rate r" data-s="0">Nicht gewusst</button></div>`}`
      : `<div class="qfoot"><button class="btn" id="show">Antwort zeigen</button>
         <span class="muted" style="font-size:13px">Erst selbst formulieren, dann aufdecken.</span></div>`;
    if(!st.shown) $("#show").onclick = ()=>{ st.shown=true; drawBody(q,st); };
    else if(!st.done) b.querySelectorAll(".rate").forEach(el=>el.onclick=()=>answer(q,st,+el.dataset.s));
  }

  else if(q.typ==="order"){
    b.innerHTML = `
      <div class="seq">${st.seq.map((it,pos)=>{
        let cls="seqrow";
        if(st.done) cls += (it.i===pos ? " right" : " wrong");
        return `<button class="${cls}" ${dis} data-pos="${pos}">
          <span class="num">${pos+1}</span><span>${esc(it.t)}</span>
          ${st.done && it.i!==pos ? `<span class="corr">richtig: ${it.i+1}</span>`:""}</button>`;
      }).join("")}</div>
      ${st.pool.length?`<div class="bank">${st.pool.map(it=>`<button class="tok" ${dis} data-id="${it.i}">${esc(it.t)}</button>`).join("")}</div>`:""}
      ${st.done?"":`<div class="qfoot"><button class="btn" id="check" ${st.pool.length?"disabled":""}>Prüfen</button>
        <span class="muted" style="font-size:13px">Anklicken ordnet ein, Klick in der Liste nimmt zurück.</span></div>`}`;
    if(!st.done){
      b.querySelectorAll(".tok").forEach(el=>el.onclick=()=>{
        const k = st.pool.findIndex(x=>x.i===+el.dataset.id);
        if(k<0) return;
        st.seq.push(st.pool.splice(k,1)[0]);
        drawBody(q,st);
      });
      b.querySelectorAll(".seqrow").forEach(el=>el.onclick=()=>{ st.pool.push(st.seq.splice(+el.dataset.pos,1)[0]); drawBody(q,st); });
      const c=$("#check"); if(c) c.onclick=()=>{
        const right = st.seq.filter((it,pos)=>it.i===pos).length;
        answer(q, st, right/q.items.length);
      };
    }
  }

  else if(q.typ==="match"){
    b.innerHTML = `
      <div class="match">${q.paare.map((p,i)=>{
        const f = st.slots[i];
        let cls="mslot"+(f?" filled":"");
        if(st.done && f) cls += (f.i===i ? " right" : " wrong");
        return `<div class="mrow">
          <button class="mleft" ${dis} data-l="${i}" aria-pressed="${st.sel===i}">${esc(p[0])}</button>
          <button class="${cls}" ${dis} data-slot="${i}">${f?esc(f.t):"…"}</button>
        </div>`;
      }).join("")}</div>
      ${st.bank.length?`<div class="bank">${st.bank.map(it=>`<button class="tok" ${dis} data-id="${it.i}">${esc(it.t)}</button>`).join("")}</div>`:""}
      ${st.done?"":`<div class="qfoot"><button class="btn" id="check" ${st.bank.length?"disabled":""}>Prüfen</button>
        <span class="muted" style="font-size:13px">Links wählen, dann unten die passende Antwort.</span></div>`}`;
    if(!st.done){
      b.querySelectorAll(".mleft").forEach(el=>el.onclick=()=>{ st.sel = st.sel===+el.dataset.l ? null : +el.dataset.l; drawBody(q,st); });
      b.querySelectorAll(".mslot").forEach(el=>el.onclick=()=>{
        const i=+el.dataset.slot;
        if(st.slots[i]){ st.bank.push(st.slots[i]); st.slots[i]=null; }
        st.sel=i; drawBody(q,st);
      });
      b.querySelectorAll(".tok").forEach(el=>el.onclick=()=>{
        const bi = st.bank.findIndex(x=>x.i===+el.dataset.id);
        if(bi<0) return;
        let t = st.sel;
        if(t===null || t<0 || t>=st.slots.length) t = st.slots.findIndex(x=>!x);
        if(t<0) return;
        const item = st.bank.splice(bi,1)[0];
        if(st.slots[t]) st.bank.push(st.slots[t]);
        st.slots[t] = item;
        const next = st.slots.findIndex(x=>!x);
        st.sel = next<0 ? null : next;
        drawBody(q,st);
      });
      const c=$("#check"); if(c) c.onclick=()=>{
        const right = st.slots.filter((f,i)=>f && f.i===i).length;
        answer(q, st, right/q.paare.length);
      };
    }
  }
}

function answer(q, st, score){
  st.done = true;
  session.scores.push(score);
  const s = stats[q.id] || {v:0,p:0,t:0,ok:0};
  s.v += 1; s.p += score; s.t = Date.now(); s.ok = score;
  stats[q.id] = s;
  saveLocal();
  drawBody(q, st);
  drawVerdict(q, st);
}

function drawVerdict(q, st){
  const score = session.scores[session.scores.length-1];
  const kind = score>=1 ? "ok" : score>0 ? "part" : "no";
  const label = score>=1 ? "Richtig" : score>0 ? `Teilweise richtig — ${Math.round(score*100)} %` : "Falsch";
  const last = session.i === session.qs.length-1;
  $("#after").innerHTML = `
    <div class="verdict ${kind}"><span class="mark">${score>=1?"✓":score>0?"◐":"✕"} ${label}</span></div>
    <p class="expl">${esc(q.erklaerung)}</p>
    <p class="src">Notiz: ${esc(q.quelle)}</p>
    <div class="qfoot"><button class="btn right" id="next">${last?"Runde auswerten":"Weiter"}</button></div>`;
  $("#next").onclick = ()=>{
    if(last) return finishRound(false);
    session.i++; session.state=null; window.scrollTo(0,0); render();
  };
  $("#next").focus();
}

async function finishRound(abgebrochen){
  const s = session;
  const total = s.scores.length;
  const run = {
    id: uid(), ts: Date.now(),
    scope: s.scope + (abgebrochen?" (abgebrochen)":""),
    total, punkte: +s.scores.reduce((a,b)=>a+b,0).toFixed(2),
    dauer: Date.now()-s.start,
    fragen: s.qs.slice(0,total).map(q=>q.id)
  };
  runs.push(run); saveLocal();
  session.run = run;
  view="result"; window.scrollTo(0,0); render();
  pushDB(run); pushNeon();
}

/* ================= ERGEBNIS ================= */
function renderResult(){
  const s = session, r = s.run;
  const q = r.punkte/r.total;
  const done = s.qs.slice(0,r.total);
  const perGoal = new Map();
  done.forEach((qq,i)=>{
    const g = perGoal.get(qq.lernziel) || {n:0,p:0,modul:qq.modul};
    g.n++; g.p += s.scores[i]; perGoal.set(qq.lernziel,g);
  });
  const weak = [...perGoal.entries()].filter(([,g])=>g.p/g.n<1).sort((a,b)=>a[1].p/a[1].n - b[1].p/b[1].n);

  $("#app").innerHTML = `
  <div class="result">
    <div class="eyebrow">Runde ausgewertet</div>
    <div class="scorebig" style="color:${quoteColor(q)}">${Math.round(q*100)}<span style="font-size:.42em">%</span></div>
    <p class="muted" style="margin-top:6px; font-size:14px">${esc(r.scope)}</p>

    <div class="resgrid">
      <div class="restile"><b>${r.punkte.toFixed(1).replace(/\.0$/,"")} / ${r.total}</b><span class="eyebrow">Punkte</span></div>
      <div class="restile"><b>${s.scores.filter(x=>x>=1).length}</b><span class="eyebrow">ganz richtig</span></div>
      <div class="restile"><b>${s.scores.filter(x=>x===0).length}</b><span class="eyebrow">daneben</span></div>
      <div class="restile"><b>${fmtDauer(r.dauer)}</b><span class="eyebrow">Dauer</span></div>
    </div>

    ${weak.length ? `
    <section>
      <div class="sec-head"><h2>Hier war es wacklig</h2></div>
      <div class="goals">
        ${weak.map(([ziel,g])=>`<button class="goal" data-ziel="${esc(ziel)}" data-zmod="${g.modul}"
          style="--mc:var(--m-${g.modul}); --gc:${quoteColor(g.p/g.n)}">
          <span class="tag">${g.modul}</span>
          <span class="txt">${esc(ziel)}</span>
          <span class="bar"><i style="width:${Math.round(g.p/g.n*100)}%"></i></span>
          <span class="pct">${Math.round(g.p/g.n*100)}%</span>
        </button>`).join("")}
      </div>
    </section>` : `<section><div class="empty">Alles gesessen — keine Schwachstelle in dieser Runde.</div></section>`}

    <section>
      <div class="sec-head"><h2>Alle Fragen dieser Runde</h2></div>
      <div class="revlist">
        ${done.map((qq,i)=>{
          const sc=s.scores[i], k = sc>=1?"ok":sc>0?"part":"no";
          return `<div class="rev ${k}"><span class="st">${sc>=1?"✓":sc>0?"◐":"✕"}</span>
            <span class="q">${esc(qq.frage)}<span class="z">${qq.modul} · ${esc(qq.lernziel)}</span></span></div>`;
        }).join("")}
      </div>
    </section>

    <div class="startbar" style="border-top:none">
      <button class="btn" id="again">Neue Runde, gleicher Filter</button>
      ${weak.length?`<button class="btn ghost" id="fix">Nur die Fehler wiederholen</button>`:""}
      <button class="btn ghost" id="back">Zur Übersicht</button>
    </div>
  </div>`;

  $("#again").onclick = ()=>{ startRound(); };
  $("#back").onclick  = ()=>{ session=null; view="dash"; window.scrollTo(0,0); render(); };
  const fx=$("#fix"); if(fx) fx.onclick = ()=>{
    const ids = new Set(done.filter((_,i)=>s.scores[i]<1).map(q=>q.id));
    session = { qs: done.filter(q=>ids.has(q.id)), i:0, scores:[], start:Date.now(),
                scope: s.run.scope+" — Wiederholung", state:null };
    view="quiz"; window.scrollTo(0,0); render();
  };
  $("#app").querySelectorAll("[data-ziel]").forEach(b=>b.onclick=()=>{
    filter.lernziel=b.dataset.ziel; filter.modul=new Set([b.dataset.zmod]);
    filter.woche=new Set(); filter.kategorie=new Set(); filter.typ=new Set(); filter.modus="mix";
    session=null; view="dash"; render(); startRound();
  });
}

/* ================= START ================= */
(async function boot(){
  loadLocal();
  // Neon wird unten von initNeon() aufgebaut — hier ist noch nichts zu laden.
  try{
    const res = await fetch("daten/fragen.json", {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const data = await res.json();
    POOL = data.fragen || [];
    META = {stand:data.stand, quelle:data.quelle};
    if(!POOL.length) throw new Error("leerer Fragenpool");
  }catch(e){
    $("#app").innerHTML = `<div class="errbox"><b>Der Fragenpool liess sich nicht laden.</b><br>
      ${esc(e.message)} — lade die Seite neu. Bleibt es dabei, fehlt die Datei <span class="mono">daten/fragen.json</span>.</div>`;
    return;
  }
  filterLaden();   // erst jetzt, denn filterSetzen() prüft gegen POOL

  // Kopfzeile: der Titel führt immer heim, der Knopf rechts zum Konto.
  $("#heim").onclick     = ()=>{ if(view!=="dash") zurDash(); };
  $("#kontoAuf").onclick = ()=>{ view==="konto" ? zurDash() : zumKonto(); };

  render();
  // Neon zuerst — das ist der Weg, der auf GitHub Pages funktioniert. Nur wenn
  // dort nichts eingerichtet ist, wird die Artefakt-Datenbank von claude.ai versucht.
  if(!await initNeon()) initDB();

  // Service Worker: macht die Seite installierbar und offline lesbar. Scheitert
  // er — altes Gerät, geöffnet über file:// —, läuft alles ganz normal weiter.
  if("serviceWorker" in navigator && location.protocol.startsWith("http")){
    try{ await navigator.serviceWorker.register("sw.js"); }catch(e){}
  }
})();
</script>
